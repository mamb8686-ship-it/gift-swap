<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GiftSwap Live - Ultimate Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #38bdf8;
            --secondary: #ec4899;
            --accent: #a855f7;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #030712; color: #fff; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }

        /* حاوية الفيديو المباشر من كاميرا الجوال مباشرة */
        .live-video-container { position: fixed; inset: 0; z-index: 1; background: #000; }
        #localVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* حاوية الهدايا العائمة */
        .floating-gifts-layer { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; }
        .flying-gift-banner {
            position: absolute; right: 20px; bottom: 100px;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.9), rgba(168, 85, 247, 0.9));
            backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.4);
            padding: 10px 20px; border-radius: 50px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(236, 72, 153, 0.5);
            animation: slideInGift 4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 60;
        }
        @keyframes slideInGift {
            0% { transform: translateX(120%) scale(0.8); opacity: 0; }
            15% { transform: translateX(0) scale(1.05); opacity: 1; }
            85% { transform: translateX(0) scale(1); opacity: 1; }
            100% { transform: translateY(-150px) scale(0.9); opacity: 0; }
        }

        /* الهيدر العلوي */
        .live-header { position: relative; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; width: 100%; pointer-events: auto; }
        .broadcaster-card { display: flex; align-items: center; gap: 10px; background: var(--glass-bg); backdrop-filter: blur(20px); padding: 6px 14px 6px 6px; border-radius: 40px; border: 1px solid var(--glass-border); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .avatar-box { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.1rem; color: #030712; }
        
        .room-stats { display: flex; gap: 8px; align-items: center; }
        .badge-live { background: rgba(239, 68, 68, 0.25); border: 1px solid rgba(239, 68, 68, 0.5); color: #f87171; padding: 6px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 900; }
        .badge-views { background: rgba(56, 189, 248, 0.2); border: 1px solid rgba(56, 189, 248, 0.4); color: var(--primary); padding: 6px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 900; }
        
        /* زر المحفظة */
        .wallet-nav-btn { background: linear-gradient(135deg, rgba(56, 189, 248, 0.3), rgba(168, 85, 247, 0.3)); border: 1px solid rgba(56, 189, 248, 0.6); color: var(--primary); padding: 7px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; pointer-events: auto; }
        .wallet-nav-btn:active { transform: scale(0.92); }

        /* صندوق الدردشة */
        .chat-container { position: relative; z-index: 100; padding: 15px; height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; margin-top: auto; width: 100%; pointer-events: auto; }
        .chat-container::-webkit-scrollbar { display: none; }
        .chat-msg { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); padding: 9px 15px; border-radius: 16px; font-size: 0.85rem; width: fit-content; max-width: 85%; border: 1px solid var(--glass-border); }
        .chat-msg span { color: var(--primary); font-weight: 700; margin-left: 6px; }

        /* شريط التحكم السفلي */
        .live-footer { position: relative; z-index: 100; display: flex; align-items: center; gap: 8px; padding: 12px 15px; background: rgba(3,7,18,0.95); width: 100%; border-top: 1px solid rgba(255,255,255,0.08); pointer-events: auto; }
        .chat-input { flex: 1; background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 12px 16px; border-radius: 30px; color: #fff; outline: none; font-size: 0.9rem; }
        .chat-input:focus { border-color: var(--primary); }

        /* زر إرسال الشات */
        .send-msg-btn { background: var(--primary); border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; color: #030712; font-weight: bold; flex-shrink: 0; }
        .send-msg-btn:active { transform: scale(0.9); }
        
        /* أزرار الكاميرا والهدايا */
        .live-cam-btn { background: linear-gradient(135deg, var(--primary), #2563eb); border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; flex-shrink: 0; box-shadow: 0 4px 15px rgba(56,189,248,0.4); }
        .live-cam-btn:active { transform: scale(0.9); }

        .gift-btn { background: linear-gradient(135deg, var(--secondary), var(--accent)); border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; flex-shrink: 0; box-shadow: 0 4px 15px rgba(236,72,153,0.4); }
        .gift-btn:active { transform: scale(0.9); }

        /* نافذة الهدايا */
        .gift-modal { position: fixed; inset: 0; z-index: 200; background: rgba(3,7,18,0.85); backdrop-filter: blur(10px); display: none; align-items: flex-end; }
        .gift-sheet { background: #0b0f19; border-top: 1px solid var(--glass-border); width: 100%; border-radius: 30px 30px 0 0; padding: 25px 20px 35px; box-shadow: 0 -20px 50px rgba(0,0,0,0.9); }

        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; }
        .wallet-badge { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; color: var(--primary); font-weight: 700; }

        .gift-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .gift-card { background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-radius: 20px; padding: 15px 10px; text-align: center; cursor: pointer; }
        .gift-card:active { transform: scale(0.95); background: rgba(255,255,255,0.1); border-color: var(--secondary); }

        .gift-icon { font-size: 2.2rem; margin-bottom: 8px; }
        .gift-name { font-size: 0.8rem; font-weight: 700; color: #e2e8f0; margin-bottom: 4px; }
        .gift-price { font-size: 0.75rem; color: var(--primary); font-weight: 900; }
    </style>
</head>
<body>

    <!-- تشغيل كاميرا الجوال مباشرة بدون صفحات خارجية أو شاشات ترحيب -->
    <div class="live-video-container">
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <!-- طبقة الهدايا المتحركة -->
    <div class="floating-gifts-layer" id="giftsLayer"></div>

    <!-- الهيدر العلوي -->
    <div class="live-header">
        <div class="broadcaster-card">
            <div class="avatar-box">م</div>
            <div>
                <div style="font-size: 0.85rem; font-weight: 900;">محمد البوسي</div>
                <div style="font-size: 0.65rem; color: #94a3b8;">ID: 84920</div>
            </div>
        </div>
        <div class="room-stats">
            <button class="wallet-nav-btn" onclick="openWallet()">💎 المحفظة</button>
            <div class="badge-live">LIVE</div>
            <div class="badge-views">👁️ 2.4K</div>
        </div>
    </div>

    <!-- الدردشة -->
    <div class="chat-container" id="chatBox">
        <div class="chat-msg"><span>سارة:</span> أهلاً بالجميع، بث رائع جداً! 🔥</div>
        <div class="chat-msg"><span>أحمد:</span> منور يا مبدع الاستريمنگ.</div>
    </div>

    <!-- شريط التحكم السفلي -->
    <div class="live-footer">
        <input type="text" class="chat-input" placeholder="اكتب تعليقاً..." id="msgInput">
        <button class="send-msg-btn" onclick="sendChatMessage()" title="إرسال">💬</button>
        <button class="live-cam-btn" onclick="launchLiveCamera()" title="تبديل الكاميرا">📹</button>
        <button class="gift-btn" onclick="toggleGiftModal(true)" title="الهدايا">🎁</button>
    </div>

    <!-- نافذة الهدايا -->
    <div class="gift-modal" id="giftModal" onclick="toggleGiftModal(false)">
        <div class="gift-sheet" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <h3 style="font-size: 1.05rem; font-weight: 900;">مركز الهدايا الملكية</h3>
                <div class="wallet-badge">💎 8,450 نقطة</div>
            </div>
            <div class="gift-grid">
                <div class="gift-card" onclick="sendGift('وردة حمراء', 10, '🌹')">
                    <div class="gift-icon">🌹</div>
                    <div class="gift-name">وردة</div>
                    <div class="gift-price">10 نقطة</div>
                </div>
                <div class="gift-card" onclick="sendGift('قلب نابض', 50, '💖')">
                    <div class="gift-icon">💖</div>
                    <div class="gift-name">قلب</div>
                    <div class="gift-price">50 نقطة</div>
                </div>
                <div class="gift-card" onclick="sendGift('خاتم ماسي', 150, '💍')">
                    <div class="gift-icon">💍</div>
                    <div class="gift-name">خاتم ماسي</div>
                    <div class="gift-price">150 نقطة</div>
                </div>
                <div class="gift-card" onclick="sendGift('سيارة فارهة', 500, '🏎️')">
                    <div class="gift-icon">🏎️</div>
                    <div class="gift-name">سيارة</div>
                    <div class="gift-price">500 نقطة</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // تشغيل الكاميرا الأمامية فوراً عند فتح الصفحة وبدون أي شاشات انضمام
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: true 
                });
                const videoElement = document.getElementById('localVideo');
                videoElement.srcObject = stream;
            } catch (error) {
                console.error("خطأ في تشغيل الكاميرا:", error);
                alert("يرجى السماح بالتطبيق بالوصول إلى الكاميرا والميكروفون من إعدادات الهاتف.");
            }
        }

        window.onload = function() {
            startCamera();
        };

        function toggleGiftModal(show) {
            document.getElementById('giftModal').style.display = show ? 'flex' : 'none';
        }

        function openWallet() {
            if (window.AndroidBridge && typeof window.AndroidBridge.navigateToWallet === 'function') {
                window.AndroidBridge.navigateToWallet();
            } else {
                alert("جاري فتح المحفظة...");
            }
        }

        let usingFrontCamera = true;
        async function launchLiveCamera() {
            try {
                usingFrontCamera = !usingFrontCamera;
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: usingFrontCamera ? "user" : "environment" }, 
                    audio: true 
                });
                document.getElementById('localVideo').srcObject = stream;
            } catch (e) {
                alert("تعذر تبديل الكاميرا");
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if(text === '') return;

            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg';
            msgDiv.innerHTML = `<span>أنت:</span> ${text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            input.value = '';
        }

        document.getElementById('msgInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        });

        function sendGift(giftName, price, icon) {
            toggleGiftModal(false);
            
            const layer = document.getElementById('giftsLayer');
            const banner = document.createElement('div');
            banner.className = 'flying-gift-banner';
            banner.innerHTML = `
                <span style="font-size: 2rem;">${icon}</span>
                <div>
                    <div style="font-size: 0.75rem; font-weight: 700; color: #fbcfe8;">أرسلت هدية فاخرة</div>
                    <div style="font-size: 0.9rem; font-weight: 900;">${giftName} (${price} نقطة)</div>
                </div>
            `;
            layer.appendChild(banner);
            setTimeout(() => banner.remove(), 4000);

            if (window.AndroidBridge && typeof window.AndroidBridge.sendGiftToFirebase === 'function') {
                window.AndroidBridge.sendGiftToFirebase(giftName, price);
            }
        }
    </script>
</body>
</html>
